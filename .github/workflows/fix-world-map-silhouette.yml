name: Fix world map silhouette

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-world-map-silhouette.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download clean public-domain continent SVG
        run: |
          curl -L --fail --retry 3 'https://upload.wikimedia.org/wikipedia/commons/9/95/Continents.svg' -o icons/world-map.svg
          test -s icons/world-map.svg
          grep -qi '<svg' icons/world-map.svg
      - name: Apply safe silhouette styling
        run: python scripts/fix_world_map_mask.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          import re, pathlib
          html=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)
          pathlib.Path('/tmp/inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/inline.js
      - name: Commit fix
        run: |
          rm -f .github/workflows/fix-world-map-silhouette.yml scripts/fix_world_map_mask.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js icons/world-map.svg .github/workflows/fix-world-map-silhouette.yml scripts/fix_world_map_mask.py
          git commit -m 'Fix world map silhouette rendering'
          git push
