name: Remove current time highlight

on:
  push:
    paths:
      - '.github/workflows/remove-current-time-highlight.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove current time highlight
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path=Path('index.html')
          text=path.read_text(encoding='utf-8')

          text=re.sub(r'\.week-current-time\{[^\n]*\}\n\.week-current-time::before\{[^\n]*\}\n\.week-current-time span\{[^\n]*\}\n?','',text,count=1)
          text=text.replace('  requestAnimationFrame(updateCurrentTimeIndicator);\n','')
          text=text.replace('  setInterval(()=>{if(currentView==="week")updateCurrentTimeIndicator()},30000);\n','')

          start=text.find('function updateCurrentTimeIndicator(){')
          if start >= 0:
              end=text.find('\nfunction financeSummaryData(period){', start)
              if end < 0:
                  raise SystemExit('financeSummaryData boundary not found')
              text=text[:start]+text[end+1:]

          if 'week-current-time' in text or 'updateCurrentTimeIndicator' in text:
              raise SystemExit('current time highlight references remain')

          path.write_text(text,encoding='utf-8')

          sw=Path('sw.js')
          sw_text=sw.read_text(encoding='utf-8')
          sw_text=sw_text.replace('mawaeidi-shell-v10','mawaeidi-shell-v11',1)
          sw.write_text(sw_text,encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S)
          app=max(scripts,key=len)
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write(app)
              name=f.name
          subprocess.run(['node','--check',name],check=True)
          PY

          git rm .github/workflows/remove-current-time-highlight.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Remove current time highlight'
          git push
