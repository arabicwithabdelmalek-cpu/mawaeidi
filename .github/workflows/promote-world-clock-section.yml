name: Promote world clock section

on:
  push:
    paths:
      - '.github/workflows/promote-world-clock-section.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote world clock to main navigation
        run: python3 scripts/promote_world_clock_section.py
      - name: Validate app JavaScript and structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S)
          app=max(scripts,key=len)
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write(app)
              name=f.name
          subprocess.run(['node','--check',name],check=True)
          required=['worldClockSectionButton','worldClockView','worldClockPageMount','setSection(\'world\'','currentSection==="world"']
          for token in required:
              if token not in text: raise SystemExit(f'missing {token}')
          tools=text.split('<details class="data-menu"',1)[1].split('</details>',1)[0]
          if 'onclick="openWorldClock()"' in tools:
              raise SystemExit('world clock still present in tools menu')
          if 'mawaeidi-shell-v16' not in Path('sw.js').read_text(encoding='utf-8'):
              raise SystemExit('cache version not updated')
          PY
      - name: Commit update
        shell: bash
        run: |
          git rm .github/workflows/promote-world-clock-section.yml scripts/promote_world_clock_section.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Promote world clock to main navigation'
          git push
