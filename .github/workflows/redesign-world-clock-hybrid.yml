name: Redesign world clock hybrid

on:
  push:
    paths:
      - '.github/workflows/redesign-world-clock-hybrid.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hybrid world clock redesign
        run: python scripts/redesign_world_clock_hybrid.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          Path('/tmp/mawaeidi-inline.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/mawaeidi-inline.js
      - name: Commit redesigned world clock
        run: |
          rm -f .github/workflows/redesign-world-clock-hybrid.yml scripts/redesign_world_clock_hybrid.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Redesign world clock with timeline first' || exit 0
          git push
