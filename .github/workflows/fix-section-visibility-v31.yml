name: Fix section visibility v31

on:
  push:
    paths:
      - 'scripts/fix_section_visibility_v31.py'
      - '.github/workflows/fix-section-visibility-v31.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply visibility fix
        run: python scripts/fix_section_visibility_v31.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S)
          Path('/tmp/mawaeidi-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/mawaeidi-inline.js
      - name: Verify visibility fix
        run: |
          grep -q 'section-visibility-v31' index.html
          grep -q '#financeView\[hidden\]' index.html
          grep -q 'mawaeidi-shell-v31' sw.js
      - name: Commit visibility fix
        run: |
          rm -f scripts/fix_section_visibility_v31.py .github/workflows/fix-section-visibility-v31.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix main section visibility'
          git push
