name: Build Mawaeidi Android APK

on:
  push:
    branches:
      - main
      - mobile-app
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "www/**"
      - "icons/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "www/**"
      - "icons/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Capacitor
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Apply Mawaeidi launcher icon
        shell: bash
        run: |
          find android/app/src/main/res -type f \( -name 'ic_launcher.*' -o -name 'ic_launcher_round.*' \) -delete
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$density"
            cp icons/icon-512.png "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp icons/icon-512.png "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mawaeidi-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
