name: Restore subtle world map

on:
  push:
    paths:
      - '.github/workflows/restore-subtle-world-map.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download clean simple world map SVG
        run: curl -L --fail 'https://upload.wikimedia.org/wikipedia/commons/4/41/Simple_world_map.svg' -o icons/world-map.svg
      - name: Restore subtle map watermark
        run: python scripts/restore_subtle_world_map.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          Path('/tmp/mawaeidi-inline.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/mawaeidi-inline.js
      - name: Commit restored map
        run: |
          rm -f .github/workflows/restore-subtle-world-map.yml scripts/restore_subtle_world_map.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore subtle world map watermark' || exit 0
          git push
