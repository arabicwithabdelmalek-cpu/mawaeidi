name: Build Mawaeidi iOS simulator app

on:
  push:
    branches:
      - ios-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout iOS source
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned mobile dependencies
        run: npm ci
      - name: Check iOS source and notification bridge
        run: npm run test:ios
      - name: Install Xcode project editing gem
        run: |
          ruby -e 'require "xcodeproj"' || gem install xcodeproj --no-document
      - name: Generate native Xcode project and approved app icon
        run: npm run ios:project
      - name: Check selected Xcode version
        run: xcodebuild -version
      - name: Build unsigned iOS Simulator application
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package iOS simulator app and native source
        run: |
          test -d build/ios/Build/Products/Debug-iphonesimulator/App.app
          ditto -c -k --keepParent build/ios/Build/Products/Debug-iphonesimulator/App.app Mawaeidi-iOS-Simulator.zip
          ditto -c -k --keepParent ios Mawaeidi-iOS-Xcode-Project.zip
      - name: Build unsigned iPhone device application (arm64)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/iphone \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package unsigned IPA for user-side Apple ID signing
        run: |
          set -euo pipefail
          APP_PATH="build/iphone/Build/Products/Debug-iphoneos/App.app"
          test -d "$APP_PATH"
          file "$APP_PATH/App"
          lipo -archs "$APP_PATH/App" | grep -q arm64
          mkdir -p iphone-package/Payload
          ditto "$APP_PATH" iphone-package/Payload/App.app
          (
            cd iphone-package
            ditto -c -k --keepParent Payload ../Mawaeidi-iPhone-unsigned.ipa
          )
          unzip -t Mawaeidi-iPhone-unsigned.ipa | tail -1
      - name: Upload unsigned device IPA (not directly installable until signed)
        uses: actions/upload-artifact@v4
        with:
          name: Mawaeidi-iPhone-unsigned-IPA
          path: Mawaeidi-iPhone-unsigned.ipa
          retention-days: 30
      - name: Upload generated iOS files for review
        uses: actions/upload-artifact@v4
        with:
          name: mawaeidi-ios-simulator-and-xcode
          path: |
            Mawaeidi-iOS-Simulator.zip
            Mawaeidi-iOS-Xcode-Project.zip
          retention-days: 30
