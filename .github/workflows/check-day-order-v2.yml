name: Validate weekday schedule ordering
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-day-order-v2.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript syntax, HTML wiring and PWA cache
        run: |
          node --check day-order.js
          python3 - <<'PY'
          from pathlib import Path
          page=Path('index.html').read_text(encoding='utf-8')
          editor=Path('day-order.js').read_text(encoding='utf-8')
          worker=Path('sw.js').read_text(encoding='utf-8')
          assert '<script src="./day-order.js?v=2" defer></script>' in page
          assert '"./day-order.js?v=2"' in worker
          assert 'function arrangeScheduleRows()' in editor
          assert 'window.setScheduleRows=function' in editor
          assert 'window.addScheduleRow=function' in editor
          assert 'arrangeEverywhere();return true' in editor
          print('PASS: script syntax, integration, cache and shared ordering')
          PY
      - name: Check existing scheduled appointments remain untouched
        run: |
          python3 - <<'PY'
          from pathlib import Path
          editor=Path('day-order.js').read_text(encoding='utf-8')
          assert 'replaceChildren(...arrangement.map(day=>options.get(day)))' in editor
          assert 'container.appendChild(row)' in editor
          assert 'const chosen=select.value;' in editor and 'select.value=chosen;' in editor
          assert 'lesson.schedules=' not in editor and 'lessons=' not in editor
          print('PASS: display changes preserve schedule row nodes, chosen days and times')
          PY