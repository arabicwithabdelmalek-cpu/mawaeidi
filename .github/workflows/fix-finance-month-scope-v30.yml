name: Fix finance month scope v30

on:
  push:
    paths:
      - 'scripts/fix_finance_month_scope_v30.py'
      - '.github/workflows/fix-finance-month-scope-v30.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply finance month-scope fix
        run: python scripts/fix_finance_month_scope_v30.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S)
          Path('/tmp/mawaeidi-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/mawaeidi-inline.js
      - name: Verify finance fix
        run: |
          grep -q 'finance-fix-v30' index.html
          grep -q 'financeSimpleRenderReady' index.html
          grep -q 'financeSimpleReadyList' index.html
          grep -q 'mawaeidi-shell-v30' sw.js
          ! grep -q 'حصة مرتبطة بالجدول' index.html
      - name: Commit finance fix
        run: |
          rm -f scripts/fix_finance_month_scope_v30.py .github/workflows/fix-finance-month-scope-v30.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Separate monthly finance from current dues'
          git push
