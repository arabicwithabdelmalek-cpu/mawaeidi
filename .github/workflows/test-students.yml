name: Student registry checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/student-trash-audit-20261028]
jobs:
  student-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run student registry and backup checks
        run: npm run test:students
