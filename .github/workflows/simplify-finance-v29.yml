name: Simplify finance v29

on:
  push:
    paths:
      - 'scripts/simplify_finance_v29.py'
      - '.github/workflows/simplify-finance-v29.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply simplified finance
        run: python scripts/simplify_finance_v29.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S)
          Path('/tmp/mawaeidi-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/mawaeidi-inline.js
      - name: Verify simplified finance
        run: |
          grep -q 'finance-simple-v29' index.html
          grep -q 'function openSimpleFinancePayment' index.html
          grep -q 'mawaeidi-shell-v29' sw.js
      - name: Commit simplified finance
        run: |
          rm -f scripts/simplify_finance_v29.py .github/workflows/simplify-finance-v29.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Simplify finance around months and lesson cards'
          git push
