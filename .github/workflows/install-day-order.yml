name: Install weekday ordering
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-day-order.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Wire weekday editor into existing page and offline shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          tag = '<script src="./day-order.js?v=1" defer></script>'
          if tag not in html:
              assert html.count('</body>') == 1, 'Expected exactly one body close tag'
              html = html.replace('</body>', tag + '\n</body>', 1)
              index.write_text(html, encoding='utf-8')
          worker = Path('sw.js')
          source = worker.read_text(encoding='utf-8')
          if '"./day-order.js"' not in source:
              assert '  "./index.html",' in source, 'Missing shell index entry'
              source = source.replace('  "./index.html",', '  "./index.html",\n  "./day-order.js",', 1)
          if 'mawaeidi-shell-v31' in source:
              source = source.replace('mawaeidi-shell-v31', 'mawaeidi-shell-v32', 1)
          worker.write_text(source, encoding='utf-8')
          assert tag in index.read_text(encoding='utf-8')
          assert '"./day-order.js"' in worker.read_text(encoding='utf-8')
          PY
      - name: Publish site changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'Enable editable weekday order in weekly table'
            git push origin HEAD:main
          fi