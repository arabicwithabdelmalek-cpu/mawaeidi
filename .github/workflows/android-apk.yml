name: Build Mawaeidi Android APK

on:
  push:
    branches:
      - main
      - mobile-app
      - "feature/native-mobile-alarm-v1"
    paths:
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "index.html"
      - "app-main.js"
      - "native-bridge.js"
      - "mobile-app.css"
      - "scripts/**"
      - "android/**"
      - "icons/**"
      - ".github/workflows/android-*.yml"
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "index.html"
      - "app-main.js"
      - "native-bridge.js"
      - "mobile-app.css"
      - "scripts/**"
      - "android/**"
      - "icons/**"
      - ".github/workflows/android-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Verify application logic
        run: npm run test:students

      - name: Synchronize bundled web assets
        run: npm run android:sync

      - name: Apply Mawaeidi launcher icon
        shell: bash
        run: |
          find android/app/src/main/res -type f \( -name 'ic_launcher.*' -o -name 'ic_launcher_round.*' \) -delete
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$density"
            cp icons/icon-512.png "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp icons/icon-512.png "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mawaeidi-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
