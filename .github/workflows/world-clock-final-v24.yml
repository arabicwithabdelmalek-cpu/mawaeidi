name: World clock final v24

on:
  push:
    paths:
      - '.github/workflows/world-clock-final-v24.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final world clock polish
        run: python scripts/world_clock_final_v24.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          Path('/tmp/mawaeidi-inline.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/mawaeidi-inline.js
      - name: Commit final polish
        run: |
          rm -f .github/workflows/world-clock-final-v24.yml scripts/world_clock_final_v24.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Polish world clock colors and city cards' || exit 0
          git push
