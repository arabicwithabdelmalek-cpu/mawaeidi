name: Simplify world clock hero

on:
  push:
    paths:
      - '.github/workflows/simplify-world-hero.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify world clock hero
        run: python scripts/simplify_world_hero.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          Path('/tmp/mawaeidi-inline.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/mawaeidi-inline.js
      - name: Commit clean hero
        run: |
          rm -f .github/workflows/simplify-world-hero.yml scripts/simplify_world_hero.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Simplify world clock hero' || exit 0
          git push
