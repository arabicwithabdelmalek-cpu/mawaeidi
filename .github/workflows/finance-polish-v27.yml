name: Finance polish v27

on:
  push:
    paths:
      - 'scripts/finance-polish-v27.py'
      - '.github/workflows/finance-polish-v27.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply finance polish
        run: python scripts/finance-polish-v27.py
      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)
          inline='\n'.join(s for s in scripts if s.strip())
          Path('/tmp/inline.js').write_text(inline,encoding='utf-8')
          PY
          node --check /tmp/inline.js
      - name: Commit finance polish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/finance-polish-v27.py .github/workflows/finance-polish-v27.yml
          git add index.html sw.js
          git commit -m 'Polish finance cards and current-state logic'
          git push
