name: Polish current time row

on:
  push:
    paths:
      - '.github/workflows/polish-current-time-row.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish current time behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          old='''function getWeekLayout(list=filtered()){
            const occurrences=currentWeekOccurrences(list),occurrenceTimes=[...new Set(occurrences.map(o=>o.time))];
            let times=occurrenceTimes;
            if(weekTimeMode==="full")times=[...new Set([...fullDayWeekTimes(),...occurrenceTimes])];
            else if(expandedWeekTimes.size)times=[...new Set([...occurrenceTimes,...expandedWeekTimes])];
            times.sort((a,b)=>mins(a)-mins(b));'''
          new='''function getWeekLayout(list=filtered()){
            const occurrences=currentWeekOccurrences(list),occurrenceTimes=[...new Set(occurrences.map(o=>o.time))];
            let times=occurrenceTimes;
            if(weekTimeMode==="full")times=[...new Set([...fullDayWeekTimes(),...occurrenceTimes])];
            else{
              if(expandedWeekTimes.size)times=[...new Set([...occurrenceTimes,...expandedWeekTimes])];
              if(selectedWeekOffset===0&&occurrenceTimes.length){
                const now=currentTimeKey(),currentHour=`${now.slice(0,2)}:00`;
                times=[...new Set([...times,currentHour])];
              }
            }
            times.sort((a,b)=>mins(a)-mins(b));'''
          if text.count(old)!=1:raise SystemExit('getWeekLayout target not found exactly once')
          text=text.replace(old,new,1)
          duplicate='''.week-slot{display:flex;flex-direction:column;gap:7px;min-height:108px;padding:8px;background:#FBFCFD}
.week-slot.today'''
          if duplicate in text:text=text.replace(duplicate,'.week-slot.today',1)
          p.write_text(text,encoding='utf-8')
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',text,flags=re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          sw=Path('sw.js');s=sw.read_text(encoding='utf-8')
          if 'mawaeidi-shell-v10' not in s:raise SystemExit('cache v10 not found')
          sw.write_text(s.replace('mawaeidi-shell-v10','mawaeidi-shell-v11',1),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/polish-current-time-row.yml
          git add index.html sw.js
          git commit -m "Polish current time indicator"
          git push origin HEAD:main
