name: Add world timezone tools

on:
  push:
    paths:
      - '.github/workflows/add-world-timezones.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch app
        run: python3 scripts/add_timezones.py
      - name: Validate JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S)
          app=max(scripts,key=len)
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write(app)
              name=f.name
          subprocess.run(['node','--check',name],check=True)
          for token in ['openWorldClock','studentTimeZone','worldClockCards','TIMEZONE_COUNTRY_MAP','readLessonTimeZone']:
              if token not in text:
                  raise SystemExit(f'missing {token}')
          if 'mawaeidi-shell-v14' not in Path('sw.js').read_text(encoding='utf-8'):
              raise SystemExit('cache version not updated')
          PY
      - name: Commit update
        shell: bash
        run: |
          git rm .github/workflows/add-world-timezones.yml scripts/add_timezones.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Add world clock and student timezones'
          git push
