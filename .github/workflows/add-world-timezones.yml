  }
  const zones=savedWorldClockZones();if(!zones.includes(result.entry.zone))zones.push(result.entry.zone);rememberWorldClockZones(zones);input.value="";input.dataset.zone="";input.dataset.zoneLabel="";document.getElementById("worldZoneSearchHint").textContent="اكتب اسم الدولة بالعربي أو المدينة، ثم اختر النتيجة.";renderWorldClockCards();
