name: Rebuild finance v28

on:
  push:
    paths:
      - 'scripts/rebuild_finance_v28.py'
      - '.github/workflows/rebuild-finance-v28.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix script guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/rebuild_finance_v28.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("if 'Finance rebuild v28 — month-first accounting' in text:","if 'function financeMonthShift(period,delta)' in text:")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply finance rebuild
        run: python scripts/rebuild_finance_v28.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S)
          Path('/tmp/mawaeidi-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/mawaeidi-inline.js
      - name: Verify finance rebuild markers
        run: |
          grep -q 'finance-rebuild-v28' index.html
          grep -q 'function financeMonthShift(period,delta)' index.html
          grep -q 'mawaeidi-shell-v28' sw.js
      - name: Commit finance rebuild
        run: |
          rm -f scripts/rebuild_finance_v28.py .github/workflows/rebuild-finance-v28.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild finance around monthly lesson value'
          git push
