name: World city clocks v23

on:
  push:
    paths:
      - '.github/workflows/world-city-clocks-v23.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply city clocks and color pass
        run: python scripts/world_city_clocks_v23.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          Path('/tmp/mawaeidi-inline.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/mawaeidi-inline.js
      - name: Commit update
        run: |
          rm -f .github/workflows/world-city-clocks-v23.yml scripts/world_city_clocks_v23.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add city clocks and refine world clock colors' || exit 0
          git push
