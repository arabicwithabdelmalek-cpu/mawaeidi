name: Home dashboard browser checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'app-main.js'
      - 'tests/home-browser-smoke.cjs'
      - '.github/workflows/test-home-browser.yml'
  push:
    branches: [design-development]
    paths:
      - 'design-system.css'
      - 'index.html'
      - 'app-main.js'
      - 'scripts/build-design-preview.cjs'
      - 'tests/design-preview-smoke.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  home-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only browser
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check responsive home and interactions with isolated fixtures
        run: node tests/home-browser-smoke.cjs
      - name: Check the actual isolated preview
        if: github.ref == 'refs/heads/design-development'
        run: node scripts/build-design-preview.cjs && node tests/design-preview-smoke.cjs
