name: Apply approved Mawaeidi collage icon
on:
  push:
    branches: [main]
    paths: [".github/workflows/apply-approved-icon.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch approved image
        env:
          SOURCE_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F5466e318-feb4-4047-ba0c-5dc4c82b3d44/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAEhDv1DVkWVxErQoqBXjF6GoVUaBLpsnn-FYa4SP_jBF&exp=1793853555&osig=AAAAAAAAAAAAAAAAAAAAAKV4UMyblOWBpPh2broyFBE72xA5TAzsMyMBsSrcP0zo&signer=media-rpc&token=AAIAAU0AJDU0NjZlMzE4LWZlYjQtNDA0Ny1iYTBjLTVkYzRjODJiM2Q0NAAAAAABoaoBATiNj0cmed6pqc-XFymEcmxRrRKFH3Oed26pVBGPJ9IPUA&x-canva-quality=thumbnail'
        run: |
          curl --fail --location --retry 3 "$SOURCE_URL" -o /tmp/mawaeidi-source.png
          file /tmp/mawaeidi-source.png
      - name: Create PWA and Android icons
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          original=Image.open("/tmp/mawaeidi-source.png").convert("RGB")
          assert original.width == original.height and original.width >= 180, "Unexpected logo"
          folder=Path("icons");folder.mkdir(exist_ok=True)
          for filename,size in [("icon-192.png",192),("icon-512.png",512),("apple-touch-icon.png",180),("favicon-32.png",32)]:
              original.resize((size,size),Image.Resampling.LANCZOS).save(folder/filename,optimize=True)
          html=Path("index.html")
          text=html.read_text(encoding="utf-8")
          old='<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">'
          assert old in text, "Favicon tag not found"
          text=text.replace(old,'<link rel="icon" href="./icons/favicon-32.png?v=2" type="image/png">')
          text=text.replace('href="./icons/apple-touch-icon.png"','href="./icons/apple-touch-icon.png?v=2"')
          html.write_text(text,encoding="utf-8")
          mf=Path("manifest.webmanifest")
          text=mf.read_text(encoding="utf-8")
          for name in ("icon-192.png","icon-512.png"):
              text=text.replace(f'./icons/{name}',f'./icons/{name}?v=2')
          mf.write_text(text,encoding="utf-8")
          sw=Path("sw.js")
          text=sw.read_text(encoding="utf-8")
          import re
          text,n=re.subn(r'mawaeidi-shell-v\d+','mawaeidi-shell-v70',text,count=1)
          assert n==1
          for name in ("icon-192.png","icon-512.png","apple-touch-icon.png"):
              text=text.replace(f'./icons/{name}"',f'./icons/{name}?v=2"')
          text=text.replace('"./icons/icon.svg",','"./icons/favicon-32.png?v=2",')
          sw.write_text(text,encoding="utf-8")
          PY
      - name: Publish only approved icon assets and references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png icons/favicon-32.png index.html manifest.webmanifest sw.js
          git commit -m "Set selected collage artwork as Mawaeidi website and Android icon"
          git push
