name: Finance UX v26

on:
  push:
    paths:
      - 'scripts/finance_ux_v26.py'
      - '.github/workflows/finance-ux-v26.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply finance UX update
        run: python scripts/finance_ux_v26.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S)
          inline='\n'.join(s for s in scripts if s.strip())
          Path('/tmp/mawaeidi-inline.js').write_text(inline,encoding='utf-8')
          PY
          node --check /tmp/mawaeidi-inline.js
      - name: Commit finance redesign
        run: |
          rm -f scripts/finance_ux_v26.py .github/workflows/finance-ux-v26.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Redesign finance dashboard UX'
          git push
