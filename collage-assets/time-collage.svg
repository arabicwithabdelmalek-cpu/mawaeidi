<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" width="520" height="470" role="img" aria-label="Collage of clock, calendar and notebook">
<defs>
<filter id="sh" x="-30%" y="-30%" width="170%" height="170%"><feDropShadow dx="1" dy="9" stdDeviation="9" flood-color="#343D3B" flood-opacity=".19"/></filter>
<filter id="sm" x="-30%" y="-30%" width="170%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#30404B" flood-opacity=".17"/></filter>
