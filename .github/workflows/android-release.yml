name: Publish signed Mawaeidi Android release

on:
  push:
    branches:
      - android-app
    paths:
      - "release/android-version.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mawaeidi-android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MAWAEIDI_KEYSTORE_PASSWORD: ${{ secrets.MAWAEIDI_KEYSTORE_PASSWORD }}
      MAWAEIDI_KEY_ALIAS: ${{ secrets.MAWAEIDI_KEY_ALIAS }}
      MAWAEIDI_KEY_PASSWORD: ${{ secrets.MAWAEIDI_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read and validate release manifest
        shell: bash
        run: |
          MAWAEIDI_VERSION_NAME="$(node -p "require('./release/android-version.json').version")"
          RELEASE_NOTES="$(node -p "require('./release/android-version.json').notes")"
          IS_PRERELEASE="$(node -p "String(require('./release/android-version.json').prerelease)")"
          if [[ ! "$MAWAEIDI_VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $MAWAEIDI_VERSION_NAME" >&2
            exit 1
          fi
          if [ "$IS_PRERELEASE" != "true" ] && [ "$IS_PRERELEASE" != "false" ]; then
            echo "prerelease must be true or false" >&2
            exit 1
          fi
          echo "MAWAEIDI_VERSION_NAME=$MAWAEIDI_VERSION_NAME" >> "$GITHUB_ENV"
          echo "MAWAEIDI_VERSION_CODE=$((2000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "MAWAEIDI_APK_NAME=Mawaeidi-${MAWAEIDI_VERSION_NAME}.apk" >> "$GITHUB_ENV"
          {
            echo "MAWAEIDI_RELEASE_NOTES<<MAWAEIDI_NOTES_EOF"
            echo "$RELEASE_NOTES"
            echo "MAWAEIDI_NOTES_EOF"
          } >> "$GITHUB_ENV"
          echo "MAWAEIDI_IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore release signing key
        shell: bash
        env:
          MAWAEIDI_KEYSTORE_BASE64: ${{ secrets.MAWAEIDI_KEYSTORE_BASE64 }}
        run: |
          test -n "$MAWAEIDI_KEYSTORE_BASE64"
          test -n "$MAWAEIDI_KEYSTORE_PASSWORD"
          test -n "$MAWAEIDI_KEY_ALIAS"
          test -n "$MAWAEIDI_KEY_PASSWORD"
          MAWAEIDI_KEYSTORE_PATH="$RUNNER_TEMP/mawaeidi-release.keystore"
          printf '%s' "$MAWAEIDI_KEYSTORE_BASE64" | base64 --decode > "$MAWAEIDI_KEYSTORE_PATH"
          chmod 600 "$MAWAEIDI_KEYSTORE_PATH"
          echo "MAWAEIDI_KEYSTORE_PATH=$MAWAEIDI_KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Verify application logic
        run: npm run test:students

      - name: Synchronize bundled web assets
        run: npm run android:sync

      - name: Apply Mawaeidi launcher icon
        shell: bash
        run: |
          find android/app/src/main/res -type f \( -name 'ic_launcher.*' -o -name 'ic_launcher_round.*' \) -delete
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$density"
            cp icons/icon-512.png "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp icons/icon-512.png "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Verify and package APK
        shell: bash
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/$MAWAEIDI_APK_NAME"
          APKSIGNER="$(find /usr/local/lib/android/sdk/build-tools -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "release/$MAWAEIDI_APK_NAME"
          sha256sum "release/$MAWAEIDI_APK_NAME" > "release/$MAWAEIDI_APK_NAME.sha256"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mawaeidi-Android-${{ env.MAWAEIDI_VERSION_NAME }}
          path: |
            release/${{ env.MAWAEIDI_APK_NAME }}
            release/${{ env.MAWAEIDI_APK_NAME }}.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$MAWAEIDI_VERSION_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists." >&2
            exit 1
          fi
          FLAGS=()
          if [ "$MAWAEIDI_IS_PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" \
            "release/$MAWAEIDI_APK_NAME" \
            "release/$MAWAEIDI_APK_NAME.sha256" \
            --target "$GITHUB_SHA" \
            --title "مواعيدي $MAWAEIDI_VERSION_NAME" \
            --notes "$MAWAEIDI_RELEASE_NOTES" \
            "${FLAGS[@]}"
