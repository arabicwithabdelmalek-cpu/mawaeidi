  const diff=zoneOffsetMinutes(date,zone)-zoneOffsetMinutes(date,SCHEDULE_TIMEZONE);if(!diff)return "نفس توقيت مصر";
  const sign=diff>0?"+":"−",abs=Math.abs(diff),hours=Math.floor(abs/60),minutes=abs%60;
  return `${sign}${hours}${minutes?`:${String(minutes).padStart(2,"0")}`:""} عن مصر`;
}
