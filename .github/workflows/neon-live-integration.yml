name: Neon live integration
on:
  push:
    branches: ['migration/neon-pilot']
    paths: ['migration/neon/live-integration.mjs', '.github/workflows/neon-live-integration.yml']
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node migration/neon/live-integration.mjs
