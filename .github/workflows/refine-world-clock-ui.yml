name: Refine world clock UI

on:
  push:
    paths:
      - '.github/workflows/refine-world-clock-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine world clock interface
        run: python3 scripts/refine_world_clock_ui.py
      - name: Validate world clock update
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S)
          app=max(scripts,key=len)
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write(app)
              name=f.name
          subprocess.run(['node','--check',name],check=True)
          required=[
              'WORLD_CLOCK_BASE_KEY',
              'id="worldBaseZone"',
              'function changeWorldClockBase()',
              'function worldHour12Label(hour)',
              'world-clock-number',
              'world-map-land',
              'world-converter-section',
              'setWorldConverterNow()',
          ]
          for token in required:
              if token not in text: raise SystemExit(f'missing {token}')
          if 'mawaeidi-shell-v17' not in Path('sw.js').read_text(encoding='utf-8'):
              raise SystemExit('cache version not updated')
          # Ensure the visual timeline is really rendered with 12-hour labels.
          block=text[text.find('function renderWorldTimeline(){'):text.find('function renderWorldClockCards(){')]
          if 'worldHour12Label' not in block: raise SystemExit('timeline is not using 12-hour labels')
          PY
      - name: Commit update
        shell: bash
        run: |
          git rm .github/workflows/refine-world-clock-ui.yml scripts/refine_world_clock_ui.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Refine world clock experience'
          git push
